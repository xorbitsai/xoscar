[build-system]
requires = [
    "setuptools>=64,<70; python_version<'3.12'",
    "setuptools>=75; python_version>='3.12'",
    "packaging",
    "wheel",
    "oldest-supported-numpy; python_version<'3.12'",
    "scipy==1.7.2; python_version>='3.10' and python_version<'3.11' and platform_machine!='arm64'",
    "scipy==1.7.3; python_version>='3.10' and python_version<'3.11' and platform_machine=='arm64'",
    "scipy==1.9.2; python_version>='3.11' and python_version<'3.12'",
    "scipy==1.16.3; python_version>='3.12' and python_version<'3.14'",
    "scipy>=1.16.3; python_version>='3.14'",
    "pandas==1.3.4; python_version>='3.10' and python_version<'3.11' and platform_machine!='arm64'",
    "pandas==1.4.0; python_version>='3.10' and python_version<'3.11' and platform_machine=='arm64'",
    "pandas==1.5.1; python_version>='3.11' and python_version<'3.12'",
    "pandas==2.3.2; python_version>='3.12' and python_version<'3.14'",
    "pandas>=2.3.3; python_version>='3.14'",
    "numpy==2.2.6; python_version>='3.12' and python_version<'3.14'",
    "numpy>=2.3.3; python_version>='3.14'",
    "cython>=0.29.33; python_version<'3.14'",
    "cython>=3.2.0; python_version>='3.14'",
    "requests>=2.4.0",
    "cloudpickle>=2.2.1; python_version>='3.11'",
    "cloudpickle==1.5.0; python_version<'3.11'",
]
build-backend = "setuptools.build_meta"

[tool.black]
include = '\.pyi?$'
force-exclude = '''
(
  ^/xoscar/(_version.py)
| shared_memory.py
)
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope="function"
markers = [
    "cuda: mark a test as a cuda case.",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = "pp* *musllinux* *i686 *-win32"
manylinux-x86_64-image = "manylinux2014"

# CPython 3.12+ needs a newer image on x86_64. manylinux2014 ships GCC 10.2.1,
# which is too old to build numpy from source (numpy requires GCC >= 10.3), and
# recent numpy/pandas releases only publish manylinux_2_28 wheels -- so pip
# falls back to a source build inside the container and fails. That happens both
# when resolving build requirements and when installing runtime dependencies
# during the test phase, which pins in build-system.requires do not constrain.
# manylinux_2_28 ships GCC 14 and has matching wheels for both phases.
# CPython 3.10-3.11 stay on manylinux2014 to keep their glibc 2.17 baseline;
# numpy and pandas still publish manylinux2014 wheels for those versions.
[[tool.cibuildwheel.overrides]]
select = "cp312-* cp313-* cp314-*"
manylinux-x86_64-image = "manylinux_2_28"
