version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: doc/source/conf.py

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - cmake

python:
  install:
    - method: pip
      path: python
      extra_requirements:
        - doc

submodules:
  include: all
  recursive: true
